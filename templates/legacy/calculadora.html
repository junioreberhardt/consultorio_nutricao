<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Macros</title>
    <!-- O JINJA IMPORTA O SEU CSS DA PASTA STATIC AQUI -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">
    <h2>📊 Avaliação Metabólica e Macronutrientes</h2>
    <p><a href="/">Voltar para a Home</a></p>
    <hr>

    <form id="form-metabolico">
        <div class="grid-2">
            <div class="form-group">
                <label>Peso (kg):</label>
                <input type="number" id="peso" step="0.1" required placeholder="Ex: 78.5">
            </div>
            <div class="form-group">
                <label>Altura (cm):</label>
                <input type="number" id="altura" required placeholder="Ex: 175">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Idade (anos):</label>
                <input type="number" id="idade" required placeholder="Ex: 26">
            </div>
            <div class="form-group">
                <label>Gênero:</label>
                <select id="genero">
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Nível de Atividade Física:</label>
            <select id="activity">
                <option value="1.2">Sedentário (Pouco ou nenhum exercício)</option>
                <option value="1.375">Levemente Ativo (Exercício leve 1-3 dias/semana)</option>
                <option value="1.55">Moderadamente Ativo (Exercício moderado 3-5 dias/semana)</option>
                <option value="1.725">Altamente Ativo (Exercício pesado 6-7 dias/semana)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Objetivo Clínico:</label>
            <select id="objetivo">
                <option value="manutencao">Manutenção de Peso</option>
                <option value="emagrecimento">Emagrecimento (Déficit Calórico)</option>
                <option value="hipertrofia">Hipertrofia (Excedente Calórico)</option>
            </select>
        </div>

        <button type="submit" class="btn">Calcular Parâmetros</button>
    </form>

    <!-- BOX DE RESULTADOS QUE O JS VAI ATIVAR -->
    <div id="painel-resultados" class="result-box">
        <h3>📋 Resultados da Avaliação</h3>
        <p>Taxa Metabólica Basal (TMB): <strong id="res-tmb"></strong></p>
        <p>Gasto Energético Total (GET): <strong id="res-get"></strong></p>
        <p>Meta Calórica Diária: <strong id="res-meta" style="color: #27ae60;"></strong></p>
        <hr>
        <h4>Sugestão de Macronutrientes Diários:</h4>
        <p><span class="macro-badge pt">Proteínas</span> <span id="res-prot"></span></p>
        <p><span class="macro-badge ch">Carboidratos</span> <span id="res-carb"></span></p>
        <p><span class="macro-badge lip">Gorduras</span> <span id="res-gord"></span></p>
    </div>
</div>

<!-- O JINJA IMPORTA O SEU SCRIPT DA PASTA STATIC AQUI -->
<script src="{{ url_for('static', filename='js/calculos.js') }}"></script>
</body>
</html>
